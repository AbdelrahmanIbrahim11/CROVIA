# One-click deployment on Render.
#
# Render reads this file, creates the database, creates the service, and wires
# DATABASE_URL between them. The two values marked sync:false are the ones only
# you can supply - Render prompts for them during setup.
#
# Deploy with: New > Blueprint, and point it at this repository.
services:
  - type: web
    name: crovia-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The build context is the repository root, because the backend reads the
    # geography file that lives under crovia-ui/.
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CROVIA_ENV
        value: production
      # Generated once by Render and kept. Everyone is signed out if it changes.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crovia-db
          property: connectionString
      # Where the app is served from. Anything not listed here is refused, so a
      # stranger's website cannot call this API using a visitor's browser.
      - key: CORS_ORIGINS
        sync: false
      # The address Nokia sends congestion and geofence notifications to. It has
      # to be this service's own public URL.
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_AUTH_TOKEN
        generateValue: true
      # Needed to create an operator or authority account. Generated and kept
      # secret by Render; read it from the dashboard when making the first
      # operator. Without it those accounts cannot be created at all, which is
      # the safe default - citizen sign-up stays open either way.
      - key: STAFF_INVITE_CODE
        generateValue: true
      # Optional. Without them the system still runs: Nokia's published test
      # numbers replace the live network, and deterministic rules replace the
      # model. Neither absence stops detection.
      - key: NOKIA_NAC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Only needed if your Nokia key is not a RapidAPI one. A key pointed at
      # the wrong host fails with an error that looks exactly like a bad key.
      - key: NOKIA_NAC_HOST
        sync: false

      # Priority for responders during an incident (Quality on Demand).
      #
      # Leave either of the first two empty and the feature stays off - the
      # alarm, the warnings and the app all work without it.
      #
      # AUTHORITY_DEVICES is the phone numbers on duty, comma separated.
      # QOD_APP_SERVER_IP is this service's own public IP: QoD protects the
      # route to ONE named server, so without it there is nothing to protect.
      - key: AUTHORITY_DEVICES
        sync: false
      - key: QOD_APP_SERVER_IP
        sync: false
      # QOS_E holds latency steady under congestion, which is what a map and an
      # acknowledge button need. The larger profiles chase throughput instead.
      - key: QOD_PROFILE
        value: QOS_E
      # Sessions are billed while they live. An hour is long enough for an
      # incident and short enough that one forgotten by a crash expires itself.
      - key: QOD_DURATION_SECONDS
        value: "3600"

databases:
  - name: crovia-db
    plan: free
    databaseName: crovia
